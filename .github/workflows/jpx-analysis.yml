# .github/workflows/jpx-analysis.yml
# JPX Market Analysis - Automated Pipeline
#
# Triggers:
#   1. Schedule (weekdays, JST 18:07 / 20:37 / 23:07): downloads the new JPX
#      files itself (scripts/fetch_jpx.py) and builds only when a new day's
#      set is complete or a new weekly file appeared
#   2. Push Excel files to data/ directory (manual upload still works)
#   3. Manual dispatch (with optional Nikkei/VI override; also fetches)
#
# What it does:
#   0. Downloads new JPX files into data/ (schedule / dispatch)
#   1. Fetches Nikkei 225 close and VI (or uses manual input)
#   2. Runs extract.py to parse Excel files → data.json
#   3. Runs render.py to generate HTML/MD files
#   4. Commits generated files and deploys via GitHub Pages

name: JPX Daily Analysis

on:
  schedule:
    # UTC. = JST 18:07 / 20:37 / 23:07 Mon-Fri. JPX publishes the day's files
    # between 16:40 and 17:45 JST; the later runs retry if a file was late.
    - cron: '7 9 * * 1-5'
    - cron: '37 11 * * 1-5'
    - cron: '7 14 * * 1-5'
  push:
    paths:
      - 'data/*.xlsx'
      - 'data/*.xls'
  workflow_dispatch:
    inputs:
      nikkei:
        description: 'Nikkei 225 close (leave empty for auto-fetch)'
        required: false
        type: string
      vi:
        description: 'Nikkei VI close (leave empty for auto-fetch)'
        required: false
        type: string
      fetch:
        description: 'Download the newest JPX files first'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: jpx-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl xlrd

      - name: Download new JPX files
        id: fetch
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.fetch != 'false')
        run: python scripts/fetch_jpx.py --datadir data

      # Scheduled runs build only when there is something new; push and manual
      # runs always build.
      - name: Decide whether to build
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] \
             || [ "${{ steps.fetch.outputs.daily_status }}" = "ready" ] \
             || [ "${{ steps.fetch.outputs.new_weekly }}" != "0" -a -n "${{ steps.fetch.outputs.new_weekly }}" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new on JPX yet (daily: ${{ steps.fetch.outputs.daily_status }})"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List data files
        if: steps.gate.outputs.build == 'true'
        run: |
          echo "=== Files in data/ ==="
          ls -la data/ || echo "No data/ directory"

      - name: Run pipeline
        if: steps.gate.outputs.build == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--datadir data --outdir ."
          if [ -n "${{ github.event.inputs.nikkei }}" ]; then
            ARGS="$ARGS --nikkei ${{ github.event.inputs.nikkei }}"
          fi
          if [ -n "${{ github.event.inputs.vi }}" ]; then
            ARGS="$ARGS --vi ${{ github.event.inputs.vi }}"
          fi
          python scripts/run_pipeline.py $ARGS

      - name: List generated files
        if: steps.gate.outputs.build == 'true'
        run: |
          echo "=== Generated files ==="
          ls -la *.html *.md data/data.json 2>/dev/null || true

      - name: Cleanup old daily files in data/
        if: steps.gate.outputs.build == 'true'
        run: |
          cd data
          # For each daily file type, keep every file of the latest date and
          # remove older dates. (One date has several files of the same type:
          # day/night x auction/J-NET for volume_by_participant, day/night for
          # market_data, so keeping only one file dropped the others.)
          for pattern in "open_interest" "market_data" "volume_by_participant"; do
            latest=$(ls -1 *${pattern}* 2>/dev/null | grep -o '^[0-9]\{8\}' | sort -r | head -1)
            for f in $(ls -1 *${pattern}* 2>/dev/null); do
              case "$f" in
                ${latest}*) echo "Keeping latest: $f" ;;
                *) echo "Removing old: $f"; git rm "$f" 2>/dev/null || rm -f "$f" ;;
              esac
            done
          done

      - name: Commit and push
        if: steps.gate.outputs.build == 'true'
        run: |
          git config user.name "JPX Analysis Bot"
          git config user.email "bot@jpx-analysis.local"
          
          # Stage generated files
          git add index.html pnl_simulator.html archive.html JPX_portal_*.html JPX_market_analysis_*.md
          git add data/ 2>/dev/null || true
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date +%Y%m%d)
            git commit -m "${DATE} analysis update [automated]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
